    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8f5;
        --surface: #ffffff;
        --surface-alt: #eef2ec;
        --text: #1a2420;
        --dim: #5c6b62;
        --border: #dfe7dd;
        --accent: #166534;
        --accent-soft: #e3efe4;
        --warn: #d97706;
        --warn-soft: #fdf1e0;
        --danger: #b91c1c;
        --red-dot: #dc2626;
        --radius: 12px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10140f;
          --surface: #1a201a;
          --surface-alt: #232a23;
          --text: #eef2ec;
          --dim: #9aa79d;
          --border: #2e382e;
          --accent: #4ade80;
          --accent-soft: #1d2f22;
          --warn: #fbbf24;
          --warn-soft: #33270f;
          --danger: #f87171;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      .font-display { font-family: "Sora", system-ui, sans-serif; }
      .tnum { font-variant-numeric: tabular-nums; }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
      button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
      a { color: inherit; text-decoration: none; }
      h1, h2, h3, p { margin: 0; }
      ul { margin: 0; padding: 0; list-style: none; }
      img { display: block; }

      .wrap { margin: 0 auto; width: 100%; max-width: 42rem; padding: 0 1rem calc(7rem + env(safe-area-inset-bottom)); padding-top: env(safe-area-inset-top); }

      /* ---------- generic controls ---------- */
      .input {
        width: 100%;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--surface);
        padding: 0.625rem 0.75rem;
        font: inherit;
        font-size: 1rem;
        color: var(--text);
        outline: none;
      }
      .input:focus { border-color: var(--accent); }
      textarea.input { resize: vertical; }
      .field { display: block; }
      .field > span.label { display: block; margin-bottom: 0.25rem; font-size: 0.875rem; font-weight: 500; }
      .field .hint { display: block; margin-top: 0.25rem; font-size: 0.75rem; color: var(--dim); }
      .form-stack { display: flex; flex-direction: column; gap: 1rem; padding-bottom: 1rem; }
      .grid-2 { display: grid; grid-template-columns: 1fr; gap: 1rem; }
      @media (min-width: 640px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        border-radius: var(--radius); padding: 0.75rem 1rem; font-weight: 500;
        border: 1px solid var(--border); background: var(--surface); min-height: 3rem;
      }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      @media (prefers-color-scheme: dark) { .btn-primary { color: #10140f; } }
      .btn-outline-accent { border-color: var(--accent); color: var(--accent); font-weight: 600; background: var(--surface); }
      .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
      .btn:disabled { opacity: 0.5; }
      .btn-row { display: flex; gap: 0.75rem; }
      .btn-row > * { flex: 1; }
      .chip-btn {
        flex-shrink: 0; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
        padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 600; min-height: 2.25rem;
      }
      .err-text { font-size: 0.875rem; font-weight: 500; color: var(--danger); }
      .warn-box { border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); padding: 0.5rem 0.75rem; font-size: 0.875rem; }
      .ok-text { font-size: 0.875rem; font-weight: 500; color: var(--accent); }
      .dim { color: var(--dim); }
      .small { font-size: 0.875rem; }
      .xsmall { font-size: 0.75rem; }

      .card { border-radius: var(--radius); background: var(--surface); }
      .list-card { border-radius: var(--radius); background: var(--surface); }
      .list-card > li + li { border-top: 1px solid var(--border); }
      .row-btn {
        display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 0.75rem;
        padding: 0.75rem 1rem; text-align: left;
      }
      .row-btn:active { background: var(--surface-alt); }
      .badge {
        border-radius: 999px; padding: 0.125rem 0.5rem; font-size: 0.75rem; font-weight: 600; flex-shrink: 0;
      }
      .badge-warn { background: var(--warn-soft); color: var(--warn); }
      .badge-accent { background: var(--accent-soft); color: var(--accent); }
      .unpaid-dot {
        display: inline-block; width: 0.5rem; height: 0.5rem; flex-shrink: 0;
        border-radius: 999px; background: var(--red-dot);
        box-shadow: 0 0 5px 1px rgba(220, 38, 38, 0.55), 0 0 11px 3px rgba(220, 38, 38, 0.28);
      }
      .due-glow { color: var(--red-dot); text-shadow: 0 0 6px rgba(220, 38, 38, 0.45), 0 0 14px rgba(220, 38, 38, 0.22); }
      .due-glow .dim { text-shadow: none; }
      .name-line { display: flex; align-items: center; gap: 0.5rem; font-weight: 500; min-width: 0; }
      .name-line .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* ---------- home ---------- */
      .home-head { display: flex; align-items: center; gap: 0.75rem; padding-top: 1rem; }
      .home-head img { width: 3.5rem; height: 3.5rem; border-radius: 999px; object-fit: contain; flex-shrink: 0; background: #fff; }
      .big-total { font-size: 3rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin-top: 0.25rem; }
      .cta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1.5rem; }
      .cta-grid .btn { padding: 1rem; font-weight: 600; min-height: 3.5rem; }
      .btn-students { width: 100%; margin-top: 0.75rem; min-height: 3.5rem; padding: 1rem; font-weight: 600; background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
      .section-title { font-size: 1rem; font-weight: 600; margin-top: 2rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
      .empty-box { margin-top: 2rem; border-radius: var(--radius); background: var(--surface); padding: 2rem 1.25rem; text-align: center; }
      .all-paid { margin-top: 2rem; border-radius: var(--radius); background: var(--accent-soft); color: var(--accent); padding: 0.75rem 1rem; font-size: 0.875rem; font-weight: 500; }

      /* ---------- tab bar ---------- */
      .tabbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        border-top: 1px solid var(--border); background: var(--surface);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .tabbar-inner { margin: 0 auto; max-width: 42rem; display: grid; grid-template-columns: repeat(5, 1fr); }
      .tabbar button {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 0.5rem 0; font-size: 0.75rem; font-weight: 500; color: var(--dim); min-height: 3.25rem;
      }
      .tabbar button[aria-current="page"] { color: var(--accent); }

      /* ---------- overlays ---------- */
      .overlay { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: var(--bg); }
      .overlay-inner { margin: 0 auto; width: 100%; max-width: 42rem; padding: 0 1rem 2.5rem; }
      .overlay-head {
        position: sticky; top: 0; z-index: 10; margin: 0 -1rem; padding: 0 1rem 0.5rem;
        padding-top: env(safe-area-inset-top);
        display: flex; align-items: center; gap: 0.5rem; background: var(--bg);
      }
      .icon-btn {
        display: flex; width: 2.5rem; height: 2.5rem; align-items: center; justify-content: center;
        border-radius: 999px; flex-shrink: 0;
      }
      .icon-btn:active { background: var(--surface-alt); }
      .overlay-head h2 { font-size: 1.125rem; font-weight: 600; }

      /* ---------- type toggle / stepper ---------- */
      .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      .type-toggle button {
        border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface);
        padding: 0.75rem 1rem; font-weight: 500; min-height: 3rem;
      }
      .type-toggle button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
      .stepper { display: flex; align-items: center; gap: 0.75rem; }
      .stepper button {
        display: flex; width: 2.5rem; height: 2.5rem; align-items: center; justify-content: center;
        border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
        font-size: 1.125rem; font-weight: 600;
      }
      .stepper button:disabled { opacity: 0.4; }
      .stepper .count { min-width: 2rem; text-align: center; font-size: 1.125rem; font-weight: 600; }
      .picker-list { margin-top: 0.75rem; max-height: 24rem; overflow-y: auto; border-radius: var(--radius); background: var(--surface); }
      .picker-list > li + li { border-top: 1px solid var(--border); }

      /* ---------- detail ---------- */
      .kv { display: flex; gap: 0.75rem; font-size: 0.875rem; }
      .kv dt { width: 8rem; flex-shrink: 0; color: var(--dim); }
      .kv dd { margin: 0; font-weight: 500; }
      .detail-rows { display: flex; flex-direction: column; gap: 0.5rem; border-top: 1px solid var(--border); padding-top: 0.75rem; margin-top: 1rem; }

      /* ---------- receipt ----------
         One wide, short landscape slip holding two identical copies side by
         side — Office Copy | Student Copy — split by a vertical dotted cut
         line with a scissors mark at the top. No border or frame around the
         sheet. On screen the sheet scales to the display width; in print it
         is laid out at true size as a 210mm × 148mm slip (see @media print). */
      .receipt-overlay { z-index: 50; }
      .receipt-overlay .overlay-inner { max-width: 70rem; }
      .receipt-sheet {
        margin: 0 auto; width: 100%; max-width: 66rem;
        display: flex; align-items: stretch;
        background: #ffffff; color: #1a2420;
      }
      .r-copy { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; padding: 1rem 1.25rem 1.125rem; font-size: 0.8125rem; }
      .r-copy-label { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #166534; }
      .r-cut { position: relative; flex: 0 0 0; border-left: 2px dotted #a3a3a3; }
      .r-scissors {
        position: absolute; top: 0.45rem; left: 0; transform: translateX(-50%);
        width: 1.05rem; height: 1.05rem; padding: 0.1rem; background: #ffffff; color: #737373;
      }
      .receipt-sheet .r-head { margin-top: 0.25rem; text-align: center; }
      .receipt-sheet .r-head img { margin: 0 auto 0.375rem; width: 3.25rem; height: 3.25rem; border-radius: 999px; object-fit: contain; }
      .receipt-sheet .r-hostel { font-size: 1.125rem; font-weight: 700; color: #166534; line-height: 1.2; }
      .receipt-sheet .r-college { margin-top: 1px; font-size: 0.8125rem; font-weight: 500; }
      .receipt-sheet .r-sub { font-size: 0.6875rem; color: #737373; }
      .receipt-sheet .r-title {
        margin-top: 0.625rem; display: flex; align-items: center; justify-content: center; gap: 0.625rem;
        font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; white-space: nowrap;
      }
      .receipt-sheet .r-title::before, .receipt-sheet .r-title::after { content: ""; flex: 0 1 2.25rem; min-width: 0.75rem; border-top: 2px solid #166534; }
      .receipt-sheet .r-meta { margin-top: 0.625rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.25rem 0.5rem; }
      .receipt-sheet .r-from { margin-top: 0.5rem; }
      .receipt-sheet .r-from .r-lab { color: #737373; }
      .receipt-sheet .r-idline { margin-top: 0.125rem; color: #404040; }
      .receipt-sheet .r-amounts { margin-top: 0.75rem; border-top: 1px dashed #d4d4d4; padding-top: 0.625rem; }
      .receipt-sheet .r-range { font-weight: 600; margin-bottom: 0.3rem; }
      .receipt-sheet .r-line { display: flex; justify-content: space-between; gap: 0.5rem; }
      .receipt-sheet .r-line > span:first-child { min-width: 0; }
      .receipt-sheet .r-line + .r-line { margin-top: 0.3rem; }
      .receipt-sheet .r-total {
        margin-top: 0.625rem; display: flex; justify-content: space-between;
        border-top: 1px solid #e5e5e5; padding-top: 0.45rem; font-size: 0.9375rem; font-weight: 700;
      }
      .receipt-sheet .r-words { margin-top: 0.25rem; font-size: 0.75rem; font-style: italic; color: #737373; }
      .receipt-sheet .r-due { margin-top: 0.5rem; font-weight: 600; }
      .receipt-sheet .r-foot { margin-top: 1rem; display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
      .receipt-sheet .r-thanks { font-style: italic; color: #404040; white-space: nowrap; }
      .receipt-sheet .r-sign { flex: 0 1 9rem; text-align: center; }
      .receipt-sheet .r-sign .line { margin-bottom: 0.25rem; height: 1px; width: 100%; background: #a3a3a3; }
      .receipt-sheet .r-sign p { font-size: 0.75rem; color: #404040; }
      @media (max-width: 40rem) {
        .r-copy { padding: 0.75rem 0.625rem 0.875rem; font-size: 0.6875rem; }
        .r-copy-label { font-size: 0.5625rem; }
        .r-scissors { width: 0.875rem; height: 0.875rem; top: 0.3rem; }
        .receipt-sheet .r-head img { width: 2.25rem; height: 2.25rem; }
        .receipt-sheet .r-hostel { font-size: 0.9375rem; }
        .receipt-sheet .r-college { font-size: 0.6875rem; }
        .receipt-sheet .r-sub { font-size: 0.5625rem; }
        .receipt-sheet .r-title { font-size: 0.6875rem; gap: 0.375rem; letter-spacing: 0.12em; }
        .receipt-sheet .r-total { font-size: 0.8125rem; }
        .receipt-sheet .r-words { font-size: 0.625rem; }
        .receipt-sheet .r-sign p { font-size: 0.625rem; }
      }
      .batch-picker { margin: 1.5rem auto 0; max-width: 66rem; }
      .batch-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
      .batch-chips button {
        border-radius: 999px; padding: 0.5rem 0.875rem; font-size: 0.875rem; font-weight: 600;
        border: 1px solid var(--border); background: var(--surface); min-height: 2.25rem;
      }
      .batch-chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
      @media (prefers-color-scheme: dark) { .batch-chips button[aria-pressed="true"] { color: #10140f; } }
      .receipt-actions { margin: 1.5rem auto 0; max-width: 66rem; display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
      .receipt-actions .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

      /* ---------- settings / backup ---------- */
      .settings-note { font-size: 0.875rem; color: var(--dim); margin-bottom: 1rem; }
      .backup-box { margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.25rem; }
      .backup-box h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }

      /* ---------- login + sync ---------- */
      .login-wrap { padding-top: 3rem; max-width: 24rem; margin: 0 auto; }
      .login-card { border-radius: var(--radius); background: var(--surface); padding: 1.5rem 1.25rem; }
      .login-card img { width: 4.5rem; height: 4.5rem; border-radius: 999px; object-fit: contain; background: #fff; margin: 0 auto 0.75rem; }
      .sync-pill {
        position: fixed; top: calc(env(safe-area-inset-top) + 0.5rem); right: 0.75rem; z-index: 60;
        border-radius: 999px; padding: 0.25rem 0.625rem; font-size: 0.6875rem; font-weight: 600;
        background: var(--accent-soft); color: var(--accent); pointer-events: none;
        max-width: 70vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .sync-pill.sync-off { background: var(--warn-soft); color: var(--warn); }

      svg.ic { flex-shrink: 0; }

      /* ---------- premium polish: depth, motion, feedback ---------- */
      :root { --shadow: 0 1px 2px rgba(20, 32, 23, 0.06), 0 12px 32px -20px rgba(20, 32, 23, 0.35); }
      @media (prefers-color-scheme: dark) {
        :root { --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 12px 32px -20px rgba(0, 0, 0, 0.85); }
      }
      .card, .list-card, .login-card, .empty-box, .picker-list { box-shadow: var(--shadow); }
      .btn-primary {
        background: linear-gradient(180deg, #1d7a40, var(--accent));
        border-color: rgba(0, 0, 0, 0.08);
        box-shadow: 0 10px 22px -12px rgba(22, 101, 52, 0.65);
      }
      @media (prefers-color-scheme: dark) {
        .btn-primary { background: linear-gradient(180deg, #6ee79b, var(--accent)); box-shadow: 0 10px 22px -12px rgba(74, 222, 128, 0.5); }
      }
      .btn, .chip-btn, .icon-btn, .type-toggle button, .stepper button, .batch-chips button, .tabbar button {
        transition: transform 0.08s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .btn:active, .chip-btn:active, .icon-btn:active, .type-toggle button:active, .stepper button:active, .batch-chips button:active { transform: scale(0.96); }
      .row-btn { transition: background-color 0.15s ease; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .input { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
      .input:focus { box-shadow: 0 0 0 3px var(--accent-soft); }
      .tabbar { box-shadow: 0 -8px 28px -22px rgba(20, 32, 23, 0.5); }

      /* view + overlay transitions — light and fast, like a native app */
      @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .view-enter { animation: viewIn 0.18s ease-out; }
      @keyframes overlayIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .overlay { animation: overlayIn 0.2s ease-out; }

      /* skeleton loading shimmer */
      .skel { border-radius: 10px; background: linear-gradient(100deg, var(--surface-alt) 40%, var(--surface) 50%, var(--surface-alt) 60%); background-size: 200% 100%; animation: shimmer 1.15s linear infinite; }
      @keyframes shimmer { from { background-position: 180% 0; } to { background-position: -20% 0; } }

      /* empty states */
      .empty-ic { width: 3.5rem; height: 3.5rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 0.75rem; }
      .empty-title { font-size: 1.0625rem; font-weight: 600; }
      .empty-text { font-size: 0.875rem; color: var(--dim); margin: 0.25rem auto 0; max-width: 24rem; }

      /* toast confirmations */
      .toast-root { position: fixed; left: 0; right: 0; bottom: calc(4.75rem + env(safe-area-inset-bottom)); z-index: 90; display: flex; flex-direction: column; align-items: center; padding: 0 1rem; pointer-events: none; }
      .toast { display: flex; align-items: center; gap: 0.5rem; max-width: 100%; border-radius: 999px; background: var(--text); color: var(--bg); padding: 0.625rem 1rem; font-size: 0.875rem; font-weight: 500; box-shadow: 0 14px 34px -12px rgba(0, 0, 0, 0.45); animation: toastIn 0.22s ease-out; }
      .toast .t-ic { display: flex; color: #4ade80; }
      @media (prefers-color-scheme: dark) { .toast .t-ic { color: #166534; } }
      @keyframes toastIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .toast.hide { opacity: 0; transform: translateY(4px); transition: opacity 0.25s ease, transform 0.25s ease; }

      /* login polish */
      .login-card { position: relative; overflow: hidden; border: 1px solid var(--border); }
      .login-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent), #65a30d); }
      .login-card img { box-shadow: 0 0 0 4px var(--accent-soft), 0 8px 20px -10px rgba(20, 32, 23, 0.4); }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }

      /* ---- Print: only the receipt sheet reaches the printer, at its true
         size — one A5-landscape slip, 210mm wide × 148mm tall (exactly half
         of an A4 page), sitting at the top of an A4 portrait page. It is
         never scaled up to fill the page and never rotated. Visibility
         isolation hides everything else in the page (app UI and any
         surrounding page chrome) while the sheet is made visible. ---- */
      @media print {
        @page { size: A4 portrait; margin: 0; }
        html, body { background: #ffffff !important; }
        body * { visibility: hidden !important; }
        .receipt-sheet, .receipt-sheet * { visibility: visible !important; }
        .receipt-sheet {
          position: absolute !important; top: 0 !important; left: 0 !important;
          width: 210mm !important; height: 148mm !important; max-width: none !important;
          margin: 0 !important; padding: 0 !important;
          box-shadow: none !important; border-radius: 0 !important;
          -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }
        /* Compact true-size type so the whole receipt fits the 148mm-tall
           slip; each copy takes half of the 210mm width (~105mm), split by
           the dotted cut line in the middle. */
        .receipt-sheet .r-copy { padding: 5mm 6mm !important; font-size: 8.5pt !important; line-height: 1.25 !important; }
        .receipt-sheet .r-copy-label { font-size: 6.5pt !important; }
        .receipt-sheet .r-head { margin-top: 1mm !important; }
        .receipt-sheet .r-head img { width: 9.5mm !important; height: 9.5mm !important; margin-bottom: 1mm !important; }
        .receipt-sheet .r-hostel { font-size: 12.5pt !important; }

              return post();
            });
          }
          return r;
        }).then(function (r) {
          syncInFlight = false;
          if (r && r.ok) {
            if (syncPending) { scheduleSync(); }
            else setSyncUI("saved");
            return true;
          }
          syncPending = true;
          setSyncUI("offline");
          return false;
        }).catch(function () {
          syncInFlight = false;
          syncPending = true;
          setSyncUI("offline");
          return false;
        });
      }
      window.addEventListener("online", function () {
        if (session && syncPending) pushRemoteState();
      });

      /* ---------------- helpers ---------------- */

      var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

      function pad2(n) { return String(n).padStart(2, "0"); }
      function todayStr() { var d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
      function currentMonth() { var d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1); }
      function monthLabel(period) {
        if (!period) return "";
        var parts = period.split("-");
        return (MONTH_NAMES[Number(parts[1]) - 1] || "") + " " + parts[0];
      }
      function addMonths(period, n) {
        var parts = period.split("-").map(Number);
        var total = parts[0] * 12 + (parts[1] - 1) + n;
        return Math.floor(total / 12) + "-" + pad2((total % 12) + 1);
      }
      function fmtDate(iso) {
        if (!iso) return "";
        var p = iso.split("-");
        return Number(p[2]) + " " + (MONTH_NAMES[Number(p[1]) - 1] || "") + " " + p[0];
      }
      function fmtMoney(n) { return "৳" + Number(n || 0).toLocaleString("en-IN"); }
      function receiptNo(id) { return "HM-" + String(id).padStart(4, "0"); }

      function inWords(n) {
        if (n === 0) return "Zero";
        var ones = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
        var tens = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
        function two(d) { return d < 20 ? ones[d] : tens[Math.floor(d / 10)] + (d % 10 ? " " + ones[d % 10] : ""); }
        function three(d) {
          var h = Math.floor(d / 100), r = d % 100;
          return (h ? ones[h] + " Hundred" + (r ? " " : "") : "") + (r ? two(r) : "");
        }
        var num = n, out = "";
        var crore = Math.floor(num / 10000000); num %= 10000000;
        var lakh = Math.floor(num / 100000); num %= 100000;
        var thou = Math.floor(num / 1000); num %= 1000;
        if (crore) out += three(crore) + " Crore ";
        if (lakh) out += two(lakh) + " Lakh ";
        if (thou) out += two(thou) + " Thousand ";
        if (num) out += three(num);
        return out.trim();
      }

      function intlPhone(phone) {
        var digits = String(phone || "").replace(/\D/g, "");
        if (digits.indexOf("880") === 0) return digits;
        if (digits.indexOf("0") === 0) return "880" + digits.slice(1);
        return digits;
      }

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      /** The fee lines a payment breaks into, for the receipt and the SMS:
          admission payments show Admission Fee / Seat Rent / Maintenance Fee;
          monthly payments split into Seat Rent + Maintenance Fee when the
          student has both. Older records fall back to their stored fields. */
      function paymentLines(p, student) {
        var lines = [];
        if (p.type === "admission") {
          if (p.seat_rent_fee != null || p.maintenance_fee != null) {
            lines.push({ label: "Admission Fee", amount: Number(p.admission_fee) || 0 });
            if (p.period) {
              lines.push({ label: "Seat Rent — " + monthLabel(p.period), amount: Number(p.seat_rent_fee) || 0 });
              lines.push({ label: "Maintenance Fee — " + monthLabel(p.period), amount: Number(p.maintenance_fee) || 0 });
            }
          } else if (p.monthly_fee != null && p.period) {
            lines.push({ label: "Admission Fee", amount: Number(p.admission_fee) || 0 });
            lines.push({ label: "Monthly Fee — " + monthLabel(p.period), amount: Number(p.monthly_fee) || 0 });
          } else {
            lines.push({ label: paymentDesc(p), amount: Number(p.amount) || 0 });
          }
        } else if (Array.isArray(p.periods) && p.periods.length > 1) {
          // Combined multi-month payment: one seat rent + maintenance pair
          // per covered month, all on the single receipt.
          var seatM = student ? (Number(student.seat_rent) || 0) : 0;
          var maintM = student ? (Number(student.maintenance_fee) || 0) : 0;
          var perMonth = Number(p.amount_per_month) || (Number(p.amount) || 0) / p.periods.length;
          p.periods.forEach(function (per) {
            if (seatM > 0 && maintM > 0) {
              var seatPartM = Math.min(perMonth, seatM);
              lines.push({ label: "Seat Rent — " + monthLabel(per), amount: seatPartM });
              lines.push({ label: "Maintenance Fee — " + monthLabel(per), amount: perMonth - seatPartM });
            } else {
              lines.push({ label: "Monthly Fee — " + monthLabel(per), amount: perMonth });
            }
          });
        } else {
          var seat = student ? (Number(student.seat_rent) || 0) : 0;
          var maint = student ? (Number(student.maintenance_fee) || 0) : 0;
          if (seat > 0 && maint > 0 && p.period) {
            var seatPart = Math.min(Number(p.amount) || 0, seat);
            lines.push({ label: "Seat Rent — " + monthLabel(p.period), amount: seatPart });
            lines.push({ label: "Maintenance Fee — " + monthLabel(p.period), amount: (Number(p.amount) || 0) - seatPart });
          } else {
            lines.push({ label: paymentDesc(p), amount: Number(p.amount) || 0 });
          }
        }
        return lines;
      }

      function paymentDesc(p) {
        if (p.type === "admission") {
          // Admission payments taken with the first month's fee carry a breakdown.
          return (p.monthly_fee != null && p.period) ? "Admission Fee + Monthly Fee — " + monthLabel(p.period) : "Admission Fee";
        }
        if (Array.isArray(p.periods) && p.periods.length > 1) {
          return "Monthly Fee — " + monthLabel(p.periods[0]) + " – " + monthLabel(p.periods[p.periods.length - 1]) + " (" + p.periods.length + " months)";
        }
        return "Monthly Fee — " + monthLabel(p.period);
      }

      function studentById(id) {
        for (var i = 0; i < state.students.length; i++) if (state.students[i].id === id) return state.students[i];
        return null;
      }
      function paymentById(id) {
        for (var i = 0; i < state.payments.length; i++) if (state.payments[i].id === id) return state.payments[i];
        return null;
      }
      function sortedStudents() {
        return state.students.slice().sort(function (a, b) {
          if (a.status !== b.status) return a.status === "active" ? -1 : 1;
          return a.name.localeCompare(b.name);
        });
      }
      /** Does a student match a search box query?
          A numbers-only query means one specific thing — a room, an ID or
          a mobile number — so it matches exactly: searching 101 shows
          Room 101 (or ID 101) only, never every student whose mobile
          number merely contains the digits 101, and never Room 110 or
          Room 2101. A mobile number is matched once at least 5 digits are
          typed, against the number's digits. Anything with letters is a
          text search and matches part of the name, room (e.g. a hall name
          like Twist), ID, department or session, as before. */
      function studentMatchesSearch(s, rawQuery) {
        var q = String(rawQuery || "").trim().toLowerCase();
        if (!q) return true;
        if (/^\d+$/.test(q)) {
          function numEq(field) {
            var f = String(field == null ? "" : field).trim().toLowerCase();
            if (!f) return false;
            if (f === q) return true;
            // Tolerate leading zeros: typing 0101 still finds room/ID 101.
            return /^\d+$/.test(f) && parseInt(f, 10) === parseInt(q, 10);
          }
          if (numEq(s.room_no) || numEq(s.roll_no) || numEq(s.bed_no)) return true;
          if (q.length >= 5) {
            var ph = String(s.phone || "").replace(/\D/g, "");
            var gh = String(s.guardian_phone || "").replace(/\D/g, "");
            if ((ph && ph.indexOf(q) >= 0) || (gh && gh.indexOf(q) >= 0)) return true;
          }
          return false;
        }
        return s.name.toLowerCase().indexOf(q) >= 0 ||
          (s.room_no || "").toLowerCase().indexOf(q) >= 0 ||
          (s.bed_no || "").toLowerCase().indexOf(q) >= 0 ||
          (s.roll_no || "").toLowerCase().indexOf(q) >= 0 ||
          (s.department || "").toLowerCase().indexOf(q) >= 0 ||
          (s.session || "").toLowerCase().indexOf(q) >= 0 ||
          (s.phone || "").indexOf(q) >= 0 ||
          (s.guardian_phone || "").indexOf(q) >= 0;
      }
      function paymentsDesc() { return state.payments.slice().sort(function (a, b) { return b.id - a.id; }); }

      /** Total paid toward a student's monthly fee for one month, across all
          payments: monthly payments count their full amount; an admission
          payment counts only the monthly-fee part actually received. */
      function monthPaidTotal(studentId, month) {
        var total = 0;
        state.payments.forEach(function (p) {
          if (p.student_id !== studentId) return;
          if (p.type === "monthly") {
            // A combined multi-month payment covers every month in its
            // periods list with the same per-month amount.
            if (Array.isArray(p.periods) && p.periods.length > 1) {
              if (p.periods.indexOf(month) >= 0) total += Number(p.amount_per_month) || (Number(p.amount) || 0) / p.periods.length;
            } else if (p.period === month) total += Number(p.amount) || 0;
            return;
          }
          if (p.period !== month) return;
          if (p.type === "admission") {
            // Newer admission payments split the monthly part into seat rent
            // + maintenance received; older ones carry a single monthly_fee.
            if (p.seat_rent_fee != null || p.maintenance_fee != null) total += (Number(p.seat_rent_fee) || 0) + (Number(p.maintenance_fee) || 0);
            else if (p.monthly_fee != null) total += Number(p.monthly_fee) || 0;
          }
        });
        return total;
      }
      /** What is still due for a student's month: the fee minus everything paid toward it. */
      function monthDue(student, month) {
        return Math.max(0, (Number(student.monthly_fee) || 0) - monthPaidTotal(student.id, month));
      }
      /** The first month a student's dues are tracked from: their admission
          month, or the earliest payment month if that is earlier. */
      function firstTrackedMonth(student) {
        var m = null;
        if (student.admission_date && /^\d{4}-\d{2}/.test(student.admission_date)) m = student.admission_date.slice(0, 7);
        state.payments.forEach(function (p) {
          if (p.student_id === student.id && p.period && (!m || p.period < m)) m = p.period;
        });
        return m || currentMonth();
      }
      /** Due (P) — everything still owed for months before the current one. */
      function previousDue(student) {
        var cur = currentMonth();
        var m = firstTrackedMonth(student);
        var total = 0, guard = 0;
        while (m < cur && guard < 600) { total += monthDue(student, m); m = addMonths(m, 1); guard++; }
        return total;
      }
      /** Due (C) — what is still owed for the current month. */
      function currentDueAmt(student) { return monthDue(student, currentMonth()); }
      /** Due (P+C) — previous due + current due, as on the father's sheet. */
      function totalDue(student) { return previousDue(student) + currentDueAmt(student); }
      /** Ids of active students with any due outstanding — previous or current. */
      function unpaidIdSet(month) {
        var set = {};
        state.students.forEach(function (s) { if (s.status === "active" && totalDue(s) > 0) set[s.id] = true; });
        return set;
      }

      function getSummary(month) {
        var all = paymentsDesc();
        var thisMonth = state.payments.filter(function (p) { return p.date.indexOf(month) === 0; });
        var unpaidSet = unpaidIdSet(month);
        var unpaid = state.students
          .filter(function (s) { return unpaidSet[s.id]; })
          .sort(function (a, b) { return a.name.localeCompare(b.name); });
        return {
          active_students: state.students.filter(function (s) { return s.status === "active"; }).length,
          collected_this_month: thisMonth.reduce(function (sum, p) { return sum + p.amount; }, 0),
          payments_this_month: thisMonth.length,
          unpaid: unpaid,
          recent: all.slice(0, 8)
        };
      }

      function smsBody(student, payment) {
        var s = state.settings;
        var lines = [
          "Payment received — " + s.hostel_name + ", " + s.college_name + ".",
          "Receipt No: " + receiptNo(payment.id),
          "Student: " + student.name
        ];
        var feeLines = paymentLines(payment, student);
        feeLines.forEach(function (l) { lines.push(l.label + ": " + fmtMoney(l.amount)); });
        if (feeLines.length > 1) lines.push("Total: " + fmtMoney(payment.amount));
        var td = totalDue(student);
        if (td > 0) lines.push("Due (P+C): " + fmtMoney(td) + " (Previous " + fmtMoney(previousDue(student)) + " + Current " + fmtMoney(currentDueAmt(student)) + ")");
        lines.push("Date: " + fmtDate(payment.date) + ". Thank you.");
        return lines.join("\n");
      }

        var entry = overlayStack.pop();
        if (entry) entry.el.remove();

                '<span class="small dim" style="display:block">' + (u.room_no ? "Room " + esc(u.room_no) + " · " : "") + '<span class="tnum due-glow" style="font-weight:600">Due (P+C) ' + fmtMoney(prev + cur) + "</span>" + (prev > 0 ? " · Previous " + fmtMoney(prev) + " + Current " + fmtMoney(cur) : " · this month " + fmtMoney(cur)) + "</span></span>" +
                '<button type="button" class="chip-btn" data-collect="' + u.id + '" aria-label="Collect payment from ' + esc(u.name) + '">Collect</button>' +
                "</div></li>";
            }).join("") + "</ul></section>";
        } else if (students.length > 0) {
          html += '<p class="all-paid">Everyone staying is fully paid up — no previous or current dues.</p>';
        }

        if (sum.recent.length > 0) {
          html += '<section><h2 class="font-display section-title">Recent payments</h2><ul class="list-card">' +
            sum.recent.map(function (p) {
              var st = studentById(p.student_id);
              return '<li><button type="button" class="row-btn" data-receipt="' + p.id + '"><span><span style="display:block;font-weight:500">' + esc(st ? st.name : "—") + '</span>' +
                '<span class="small dim" style="display:block">' + esc(paymentDesc(p)) + " · " + esc(fmtDate(p.date)) + '</span></span>' +
                '<span class="tnum font-display" style="font-weight:600">' + fmtMoney(p.amount) + "</span></button></li>";
            }).join("") + "</ul></section>";
        }

        view.innerHTML = html;
        document.getElementById("cta-monthly").addEventListener("click", function () { openMonthlyPayment(null); });
        document.getElementById("cta-admission").addEventListener("click", function () { openStudentForm(null); });
        document.getElementById("cta-students").addEventListener("click", function () { currentTab = "students"; renderMain(); window.scrollTo(0, 0); });
        Array.prototype.forEach.call(view.querySelectorAll("[data-collect]"), function (b) {
          b.addEventListener("click", function () { openMonthlyPayment(Number(b.getAttribute("data-collect"))); });
        });
        Array.prototype.forEach.call(view.querySelectorAll("[data-receipt]"), function (b) {
          b.addEventListener("click", function () { openReceipt(Number(b.getAttribute("data-receipt")), null); });
        });
      }

      /* ---------------- Students tab ---------------- */
      function renderStudents() {
        var month = currentMonth();
        var unpaid = unpaidIdSet(month);
        var students = sortedStudents();
        var filtered = students.filter(function (s) { return studentMatchesSearch(s, studentSearch); });
        // Searching by room / ID / mobile is all digits: once the typed
        // search is digits-only, the field asks the phone for the number
        // keyboard instead of the ABC one (it re-renders and refocuses on
        // every keystroke, so the keyboard switches right after the first
        // digit). Clearing the digits brings the letter keyboard back.
        var searchInputMode = /^\d+$/.test(studentSearch.trim()) ? "numeric" : "text";
        var html = '<div style="padding-top:1rem"><div style="display:flex;align-items:center;gap:0.75rem">' +
          '<input class="input" id="student-search" aria-label="Search students" placeholder="Search name, room, ID or mobile…" autocomplete="off" inputmode="' + searchInputMode + '" value="' + esc(studentSearch) + '" style="flex:1" />' +
          '<button type="button" class="btn btn-primary" id="btn-admit" style="flex-shrink:0;min-height:2.75rem">' + I.plus + " Admit</button></div>";

        if (filtered.length === 0) {
          html += students.length === 0
            ? emptyStateHtml(I.users, "No students yet", "Tap Admit to add the first student. Their payments and dues will be tracked here.")
            : emptyStateHtml(I.search, "No matches", "No students match your search. Try a name, room, ID or mobile number.");
        } else {
          html += '<ul class="list-card" style="margin-top:1rem">' + filtered.map(function (s) {
            if (studentPendingDelete === s.id) {
              return '<li><div style="padding:0.75rem 1rem">' +
                '<p style="font-weight:600">Delete ' + esc(s.name) + ' from the database?</p>' +
                '<p class="small dim" style="margin-top:0.25rem">The student and all their payment records will be removed permanently. This cannot be undone.</p>' +
                '<div class="btn-row" style="margin-top:0.75rem">' +
                  '<button type="button" class="btn" data-del-cancel>Cancel</button>' +
                  '<button type="button" class="btn btn-danger" data-del-confirm="' + s.id + '">Delete student</button>' +
                "</div></div></li>";
            }
            return '<li><div style="display:flex;align-items:center;gap:0.25rem;padding:0 0.5rem 0 0">' +
              '<button type="button" class="row-btn" data-detail="' + s.id + '" aria-label="View details for ' + esc(s.name) + '" style="flex:1;min-width:0">' +
                '<span style="min-width:0"><span class="name-line">' + (unpaid[s.id] ? unpaidDot(month) : "") + '<span class="nm">' + esc(s.name) + "</span></span>" +
                '<span class="small dim truncate" style="display:block">' + (s.room_no ? "Room " + esc(s.room_no) + " · " : "") + '<span class="tnum">' + fmtMoney(s.monthly_fee) + "</span>/month</span>" +
                (unpaid[s.id] ? '<span class="small due-glow" style="display:block;font-weight:500">Due (P+C) <span class="tnum">' + fmtMoney(totalDue(s)) + "</span>" + (previousDue(s) > 0 ? ' <span style="font-weight:400" class="dim">(Prev ' + fmtMoney(previousDue(s)) + " + Current " + fmtMoney(monthDue(s, month)) + ")</span>" : " for " + esc(monthLabel(month))) + "</span>" : "") + "</span>" +
                '<span style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0">' + (s.status === "inactive" ? '<span class="badge badge-warn">Left</span>' : "") + '<span class="dim">' + I.chevR + "</span></span>" +
              "</button>" +
              '<button type="button" class="chip-btn" data-pay="' + s.id + '" aria-label="Record monthly payment for ' + esc(s.name) + '">Pay</button>' +
              '<button type="button" class="icon-btn" data-del="' + s.id + '" aria-label="Delete ' + esc(s.name) + ' from the database" style="color:var(--danger)">' + I.trash + "</button>" +
              "</div></li>";
          }).join("") + "</ul>";
        }
        html += "</div>";
        view.innerHTML = html;

        var searchEl = document.getElementById("student-search");
        searchEl.addEventListener("input", function () {
          studentSearch = searchEl.value;
          studentPendingDelete = null;
          var pos = searchEl.selectionStart;
          renderStudents();
          var el2 = document.getElementById("student-search");
          el2.focus();
          try { el2.setSelectionRange(pos, pos); } catch (e) {}
        });
        document.getElementById("btn-admit").addEventListener("click", function () { openStudentForm(null); });
        Array.prototype.forEach.call(view.querySelectorAll("[data-detail]"), function (b) {
          b.addEventListener("click", function () { openStudentDetail(Number(b.getAttribute("data-detail"))); });
        });
        Array.prototype.forEach.call(view.querySelectorAll("[data-pay]"), function (b) {
          b.addEventListener("click", function () { openMonthlyPayment(Number(b.getAttribute("data-pay"))); });
        });
        Array.prototype.forEach.call(view.querySelectorAll("[data-del]"), function (b) {
          b.addEventListener("click", function () { studentPendingDelete = Number(b.getAttribute("data-del")); renderStudents(); });
        });
        Array.prototype.forEach.call(view.querySelectorAll("[data-del-cancel]"), function (b) {
          b.addEventListener("click", function () { studentPendingDelete = null; renderStudents(); });
        });
        Array.prototype.forEach.call(view.querySelectorAll("[data-del-confirm]"), function (b) {
          b.addEventListener("click", function () {
            var id = Number(b.getAttribute("data-del-confirm"));
            state.payments = state.payments.filter(function (p) { return p.student_id !== id; });
            state.students = state.students.filter(function (st) { return st.id !== id; });
            studentPendingDelete = null;
            saveState();
            renderStudents();
            showToast("Student deleted");
          });
        });
      }

      /* ---------------- Payments tab ---------------- */
      function renderPayments() {
        var payments = paymentsDesc().slice(0, 200);
        var html = '<div style="padding-top:1rem"><h2 class="font-display" style="font-size:1.125rem;font-weight:600">All payments</h2>';
        if (payments.length === 0) {
          html += emptyStateHtml(I.receipt, "No payments yet", "Payments you record will appear here, newest first, each with its receipt.");
        } else {
          html += '<ul class="list-card" style="margin-top:0.75rem">' + payments.map(function (p) {
            var st = studentById(p.student_id);
            if (paymentPendingDelete === p.id) {
              return '<li><div style="padding:0.75rem 1rem">' +
                '<p style="font-weight:600">Delete this payment record?</p>' +
                '<p class="small dim" style="margin-top:0.25rem">' + esc(st ? st.name : "—") + " · " + esc(paymentDesc(p)) + ' · <span class="tnum">' + fmtMoney(p.amount) + "</span> · " + receiptNo(p.id) + ". The totals will update, and any due for that month will go up again.</p>" +
                '<div class="btn-row" style="margin-top:0.75rem">' +
                  '<button type="button" class="btn" data-pdel-cancel>Keep record</button>' +
