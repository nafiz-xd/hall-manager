              '<button type="button" class="row-btn" data-receipt="' + p.id + '" style="flex:1;min-width:0"><span style="min-width:0"><span style="display:block;font-weight:500">' + esc(st ? st.name : "—") + '</span>' +
              '<span class="small dim truncate" style="display:block">' + esc(paymentDesc(p)) + " · " + receiptNo(p.id) + " · " + esc(fmtDate(p.date)) + '</span></span>' +
              '<span class="tnum font-display" style="font-weight:600">' + fmtMoney(p.amount) + "</span></button>" +
              '<button type="button" class="icon-btn" data-pdel="' + p.id + '" aria-label="Delete payment ' + receiptNo(p.id) + " for " + esc(st ? st.name : "this student") + '" style="color:var(--danger)">' + I.trash + "</button>" +
              "</div></li>";
          }).join("") + "</ul>";
        }
        html += "</div>";
        view.innerHTML = html;
        Array.prototype.forEach.call(view.querySelectorAll("[data-receipt]"), function (b) {
          b.addEventListener("click", function () { openReceipt(Number(b.getAttribute("data-receipt")), null); });
        });
        Array.prototype.forEach.call(view.querySelectorAll("[data-pdel]"), function (b) {
          b.addEventListener("click", function () { paymentPendingDelete = Number(b.getAttribute("data-pdel")); renderPayments(); });
        });
        Array.prototype.forEach.call(view.querySelectorAll("[data-pdel-cancel]"), function (b) {
          b.addEventListener("click", function () { paymentPendingDelete = null; renderPayments(); });
        });
        Array.prototype.forEach.call(view.querySelectorAll("[data-pdel-confirm]"), function (b) {
          b.addEventListener("click", function () {
            var id = Number(b.getAttribute("data-pdel-confirm"));
            state.payments = state.payments.filter(function (p) { return p.id !== id; });
            paymentPendingDelete = null;
            saveState();
            renderPayments();
            showToast("Payment deleted");
          });
        });
      }
      /* ---------------- Reminders tab ----------------
         One view of everyone who still owes money, split into the two kinds
         of due: previous months (P) and the current month (C). Dues are
         computed from the current month, so when a month ends its unpaid
         part automatically counts as previous due — nothing to move by hand. */
      function renderReminders() {
        var month = currentMonth();
        var active = state.students.filter(function (s) { return s.status === "active"; });
        var withPrev = [], withCurOnly = [];
        var prevTotal = 0, curTotal = 0;
        active.forEach(function (s) {
          var prev = previousDue(s);
          var cur = monthDue(s, month);
          if (prev > 0) { withPrev.push({ s: s, prev: prev, cur: cur }); prevTotal += prev; curTotal += cur; }
          else if (cur > 0) { withCurOnly.push({ s: s, prev: 0, cur: cur }); curTotal += cur; }
        });
        function byDueDesc(a, b) {
          return ((b.prev + b.cur) - (a.prev + a.cur)) || a.s.name.localeCompare(b.s.name);
        }
        withPrev.sort(byDueDesc);
        withCurOnly.sort(byDueDesc);
        var owingCount = withPrev.length + withCurOnly.length;

        function reminderRow(item, headline) {
          var s = item.s;
          return '<li><div style="display:flex;align-items:center;justify-content:space-between;gap:0.75rem;padding:0.75rem 1rem">' +
            '<span style="min-width:0"><span class="name-line"><span class="unpaid-dot" role="img" aria-label="Has unpaid dues" title="Has unpaid dues"></span><span class="nm">' + esc(s.name) + "</span></span>" +
            '<span class="small dim truncate" style="display:block">' + (s.room_no ? "Room " + esc(s.room_no) + " · " : "") + (s.roll_no ? "ID " + esc(s.roll_no) + " · " : "") + esc(s.phone) + "</span>" +
            '<span class="small due-glow" style="display:block;font-weight:500">' + headline + "</span></span>" +
            '<button type="button" class="chip-btn" data-collect="' + s.id + '" aria-label="Collect payment from ' + esc(s.name) + '">Collect</button>' +
            "</div></li>";
        }

        var html = '<div style="padding-top:1rem"><h2 class="font-display" style="font-size:1.125rem;font-weight:600">Reminders</h2>';

        if (active.length === 0) {
          html += emptyStateHtml(I.bell, "No students yet", "Dues will appear here once students are admitted.");
        } else if (owingCount === 0) {
          html += '<p class="all-paid" style="margin-top:1rem">No dues right now — everyone staying is fully paid up, for previous months and for ' + esc(monthLabel(month)) + ".</p>";
        } else {
          html += '<p class="small dim" style="margin-top:0.25rem">' + owingCount + (owingCount === 1 ? " student owes money" : " students owe money") + ' · Total Due (P+C) <span class="tnum due-glow" style="font-weight:600">' + fmtMoney(prevTotal + curTotal) + "</span>" +
            (prevTotal > 0 ? ' <span class="tnum">(Previous ' + fmtMoney(prevTotal) + " + Current " + fmtMoney(curTotal) + ")</span>" : "") + "</p>";

          if (withPrev.length > 0) {
            html += '<section><h3 class="font-display section-title">Previous due' +
              ' <span class="badge badge-warn">' + withPrev.length + "</span></h3>" +
              '<ul class="list-card">' + withPrev.map(function (item) {
                var headline = 'Previous due <span class="tnum">' + fmtMoney(item.prev) + "</span>";
                if (item.cur > 0) headline += ' <span class="dim" style="font-weight:400">· Due (P+C) ' + fmtMoney(item.prev + item.cur) + " — plus " + fmtMoney(item.cur) + " for " + esc(monthLabel(month)) + "</span>";
                return reminderRow(item, headline);
              }).join("") + "</ul></section>";
          }

          if (withCurOnly.length > 0) {
            html += '<section><h3 class="font-display section-title">Due this month — ' + esc(monthLabel(month)) +
              ' <span class="badge badge-warn">' + withCurOnly.length + "</span></h3>" +
              '<ul class="list-card">' + withCurOnly.map(function (item) {
                return reminderRow(item, 'Due <span class="tnum">' + fmtMoney(item.cur) + "</span> for " + esc(monthLabel(month)));
              }).join("") + "</ul>" +
              '<p class="small dim" style="margin-top:0.75rem">Anything still unpaid when ' + esc(monthLabel(month)) + ' ends moves into Previous due on its own.</p></section>';
          } else if (withPrev.length > 0) {
            html += '<p class="small dim" style="margin-top:1rem">Nobody else owes for ' + esc(monthLabel(month)) + ' — this month is clear apart from the previous dues above.</p>';
          }
        }

        html += "</div>";
        view.innerHTML = html;
        Array.prototype.forEach.call(view.querySelectorAll("[data-collect]"), function (b) {
          b.addEventListener("click", function () { openMonthlyPayment(Number(b.getAttribute("data-collect"))); });
        });
      }
      /* ---------------- shared form bits ---------------- */
      function fieldHtml(label, inner, hint) {
        return '<label class="field"><span class="label">' + esc(label) + "</span>" + inner + (hint ? '<span class="hint">' + esc(hint) + "</span>" : "") + "</label>";
      }
      function inputHtml(id, label, value, attrs) {
        return '<input class="input" id="' + id + '" aria-label="' + esc(label) + '" value="' + esc(value == null ? "" : value) + '" ' + (attrs || "") + " />";
      }
      function overlayForm(title, bodyHtml, onSubmit, refresh) {
        var entry = openOverlay('<form id="ov-form" class="form-stack">' + bodyHtml + "</form>", { title: title, refresh: refresh });
        var form = entry.el.querySelector("#ov-form");
        form.addEventListener("submit", function (e) { e.preventDefault(); onSubmit(form, entry); });
        return entry;
      }
      function formError(form, msg) {
        var el = form.querySelector("[data-form-error]");
        if (el) { el.textContent = msg; el.style.display = msg ? "" : "none"; }
      }

      /* ---------------- student form (admission + edit) ---------------- */
      function openStudentForm(initial) {
        var isEdit = initial != null;
        var s = state.settings;
        var v = initial || {};
        var seatVal = isEdit ? (v.seat_rent != null ? v.seat_rent : (v.monthly_fee || 0)) : (Number(s.default_seat_rent) || 0);
        var maintVal = isEdit ? (v.maintenance_fee != null ? v.maintenance_fee : 0) : (Number(s.default_maintenance_fee) || 0);
        var body =
          fieldHtml("Student name *", inputHtml("f-name", "Student name", v.name || "", 'placeholder="e.g. Md. Rahim Uddin" autocomplete="off"')) +
          '<div class="grid-2">' +
            fieldHtml("Student mobile *", inputHtml("f-phone", "Student mobile", v.phone || "", 'type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX"')) +
            fieldHtml("Room no.", inputHtml("f-room", "Room number", v.room_no || "", 'inputmode="numeric" autocomplete="off"')) +
            fieldHtml("ID", inputHtml("f-roll", "Student ID", v.roll_no || "", 'placeholder="e.g. 21045" inputmode="numeric" autocomplete="off"')) +
            fieldHtml("Admission date", inputHtml("f-adate", "Admission date", v.admission_date || todayStr(), 'type="date"')) +
          "</div>" +
          '<p class="font-display" style="font-weight:600;margin-top:0.25rem">Monthly fee</p>' +
          '<div class="grid-2">' +
            fieldHtml("Seat rent (৳)", inputHtml("f-seat", "Seat rent in taka", seatVal, 'inputmode="numeric" autocomplete="off"')) +
            fieldHtml("Maintenance fee (৳)", inputHtml("f-maint", "Maintenance fee in taka", maintVal, 'inputmode="numeric" autocomplete="off"')) +
          "</div>" +
          '<p class="small">Monthly fee total: <strong class="tnum" id="f-mtotal">' + fmtMoney((Number(seatVal) || 0) + (Number(maintVal) || 0)) + '</strong> <span class="dim">— seat rent + maintenance fee, charged every month.</span></p>' +
          (!isEdit ?
            '<p class="font-display" style="font-weight:600;margin-top:0.25rem">Payment received at admission</p>' +
            '<div class="grid-2">' +
              fieldHtml("Admission fee received (৳)", inputHtml("f-afee", "Admission fee received in taka", s.default_admission_fee, 'inputmode="numeric" autocomplete="off"'), "One-time fee, charged at admission.") +
              fieldHtml("Seat rent received — " + monthLabel(currentMonth()) + " (৳)", inputHtml("f-seatpay", "Seat rent received for " + monthLabel(currentMonth()) + " in taka", seatVal, 'inputmode="numeric" autocomplete="off"')) +
              fieldHtml("Maintenance received — " + monthLabel(currentMonth()) + " (৳)", inputHtml("f-maintpay", "Maintenance fee received for " + monthLabel(currentMonth()) + " in taka", maintVal, 'inputmode="numeric" autocomplete="off"')) +
            "</div>" +
            '<p class="small dim">Enter what was actually received for each — the full amount, part of it, or 0. Any unpaid part stays as due, and the red dot stays until the month is fully paid.</p>' +
            '<p class="small">Total received now: <strong class="tnum" id="f-total">' + fmtMoney((Number(s.default_admission_fee) || 0) + (Number(seatVal) || 0) + (Number(maintVal) || 0)) + '</strong> <span class="dim">— one receipt will show the amounts actually received.</span></p>'
          : "") +
          '<p class="err-text" data-form-error style="display:none"></p>' +
          '<div class="btn-row" style="padding-top:0.25rem">' +
            '<button type="button" class="btn" data-cancel>Cancel</button>' +
            '<button type="submit" class="btn btn-primary">' + (isEdit ? "Save changes" : "Admit student") + "</button>" +
          "</div>";

        var entry = overlayForm(isEdit ? "Edit student" : "New admission", body, function (form) {
          function val(id) { return form.querySelector("#" + id).value; }
          var name = val("f-name").trim();
          var phone = val("f-phone").trim();
          var admissionDate = val("f-adate");
          if (!name) { formError(form, "Student name is required."); return; }
          if (phone.length < 5) { formError(form, "A valid mobile number is required for SMS."); return; }
          if (!admissionDate) { formError(form, "Admission date is required."); return; }
          formError(form, "");
          var seatRent = Number(val("f-seat")) || 0;
          var maintFee = Number(val("f-maint")) || 0;
          // Only the fields shown on the form are written here — editing a
          // student keeps any older saved details (father's name, department,
          // address…) untouched in their record.
          var data = {
            name: name,
            phone: phone,
            room_no: val("f-room").trim(),
            roll_no: val("f-roll").trim(),
            admission_date: admissionDate,
            seat_rent: seatRent,
            maintenance_fee: maintFee,
            monthly_fee: seatRent + maintFee
          };
          if (isEdit) {
            var st = studentById(initial.id);
            if (st) Object.assign(st, data);
            saveState();
            closeOverlay();
            showToast("Student details saved");
          } else {
            var student = Object.assign({ id: state.nextStudentId++, status: "active" }, data);
            state.students.push(student);
            var receiptId = null;
            var admissionPaid = Number(val("f-afee")) || 0;
            var seatPaid = Number(val("f-seatpay")) || 0;
            var maintPaid = Number(val("f-maintpay")) || 0;
            var monthlyPaid = seatPaid + maintPaid;
            if (monthlyPaid > 0) {
              // Admission fee + first month's seat rent and maintenance on a
              // single receipt. Only the parts actually received count toward
              // the first month — any shortfall stays due (red dot).
              var payBoth = { id: state.nextPaymentId++, student_id: student.id, type: "admission", period: currentMonth(), amount: admissionPaid + monthlyPaid, admission_fee: admissionPaid, seat_rent_fee: seatPaid, maintenance_fee: maintPaid, monthly_fee: monthlyPaid, date: admissionDate, note: null };
              state.payments.push(payBoth);
              receiptId = payBoth.id;
            } else if (admissionPaid > 0) {
              var pay = { id: state.nextPaymentId++, student_id: student.id, type: "admission", period: null, amount: admissionPaid, date: admissionDate, note: null };
              state.payments.push(pay);
              receiptId = pay.id;
            }
            saveState();
            closeOverlay();
            if (receiptId != null) openReceipt(receiptId, null);
            else { currentTab = "students"; renderMain(); showToast("Student admitted"); }
          }
        });
        var seatEl = entry.el.querySelector("#f-seat");
        var maintEl = entry.el.querySelector("#f-maint");
        var mtotalEl = entry.el.querySelector("#f-mtotal");
        var updMtotal = function () { if (mtotalEl) mtotalEl.textContent = fmtMoney((Number(seatEl.value) || 0) + (Number(maintEl.value) || 0)); };
        if (seatEl) seatEl.addEventListener("input", updMtotal);
        if (maintEl) maintEl.addEventListener("input", updMtotal);
        if (!isEdit) {
          var afeeEl = entry.el.querySelector("#f-afee");
          var seatpayEl = entry.el.querySelector("#f-seatpay");
          var maintpayEl = entry.el.querySelector("#f-maintpay");
          var totalEl = entry.el.querySelector("#f-total");
          var seatTouched = false, maintTouched = false;
          var updTotal = function () { if (totalEl) totalEl.textContent = fmtMoney((Number(afeeEl.value) || 0) + (Number(seatpayEl.value) || 0) + (Number(maintpayEl.value) || 0)); };
          if (afeeEl) afeeEl.addEventListener("input", updTotal);
          if (seatpayEl) seatpayEl.addEventListener("input", function () { seatTouched = true; updTotal(); });
          if (maintpayEl) maintpayEl.addEventListener("input", function () { maintTouched = true; updTotal(); });
          // Keep each "received now" in step with its fee until edited by hand.
          if (seatEl) seatEl.addEventListener("input", function () { if (!seatTouched && seatpayEl) seatpayEl.value = seatEl.value; updTotal(); });
          if (maintEl) maintEl.addEventListener("input", function () { if (!maintTouched && maintpayEl) maintpayEl.value = maintEl.value; updTotal(); });
        }
        entry.el.querySelector("[data-cancel]").addEventListener("click", closeOverlay);
        var nameEl = entry.el.querySelector("#f-name");
        if (nameEl) nameEl.focus();
      }

      /* ---------------- single payment form (from student detail) ---------------- */
      function openPaymentForm(studentId) {
        var student = studentById(studentId);
        if (!student) return;
        var s = state.settings;
        var type = "monthly";
        var body =
          '<div class="card" style="padding:1rem"><p class="font-display" style="font-size:1.125rem;font-weight:600">' + esc(student.name) + "</p>" +
          '<p class="small dim">' + (student.room_no ? "Room " + esc(student.room_no) : "No room set") + (student.department ? " · " + esc(student.department) : "") + " · " + esc(student.phone) + "</p></div>" +
          '<div class="type-toggle" role="group" aria-label="Payment type">' +
            '<button type="button" data-ptype="monthly" aria-pressed="true">Monthly fee</button>' +
            '<button type="button" data-ptype="admission" aria-pressed="false">Admission fee</button>' +
          "</div>" +
          '<div data-period-wrap>' + fieldHtml("Month this payment is for", inputHtml("p-period", "Month this payment is for", currentMonth(), 'type="month"')) + '<p class="small" data-due-info style="margin-top:0.5rem"></p></div>' +
          '<div class="grid-2">' +
            fieldHtml("Amount received (৳)", inputHtml("p-amount", "Amount received in taka", student.monthly_fee || "", 'inputmode="numeric" autocomplete="off"')) +
            fieldHtml("Date received", inputHtml("p-date", "Date received", todayStr(), 'type="date"')) +
          "</div>" +
          fieldHtml("Note (optional)", inputHtml("p-note", "Note", "", 'placeholder="e.g. Paid in two parts" autocomplete="off"')) +
          '<p class="err-text" data-form-error style="display:none"></p>' +
          '<div class="btn-row" style="padding-top:0.25rem">' +
            '<button type="button" class="btn" data-cancel>Cancel</button>' +
            '<button type="submit" class="btn btn-primary">Save &amp; make receipt</button>' +
          "</div>";

        var entry = overlayForm("Record payment", body, function (form) {
          var amount = Number(form.querySelector("#p-amount").value);
          var date = form.querySelector("#p-date").value;
          var period = form.querySelector("#p-period").value;
          if (type === "monthly" && /^\d{4}-\d{2}$/.test(period) && monthDue(student, period) <= 0) { formError(form, monthLabel(period) + " is already fully paid for this student."); return; }
          if (!amount || amount <= 0) { formError(form, "Enter the amount received."); return; }
          if (type === "monthly" && !/^\d{4}-\d{2}$/.test(period)) { formError(form, "Pick the month this payment is for."); return; }
          if (!date) { formError(form, "Payment date is required."); return; }
          formError(form, "");
          var pay = {
            id: state.nextPaymentId++, student_id: student.id, type: type,
            period: type === "monthly" ? period : null,
            amount: amount, date: date,
            note: form.querySelector("#p-note").value.trim() || null
          };
          state.payments.push(pay);
          saveState();
          closeOverlay();
          openReceipt(pay.id, null);
        });
        entry.el.querySelector("[data-cancel]").addEventListener("click", closeOverlay);
        function refreshDue() {
          var infoEl = entry.el.querySelector("[data-due-info]");
          var amtEl = entry.el.querySelector("#p-amount");
          if (!infoEl) return;
          if (type !== "monthly") { infoEl.innerHTML = ""; return; }
          var period = entry.el.querySelector("#p-period").value;
          if (!/^\d{4}-\d{2}$/.test(period)) { infoEl.innerHTML = ""; return; }
          var paidAmt = monthPaidTotal(student.id, period);
          var due = Math.max(0, (Number(student.monthly_fee) || 0) - paidAmt);
          var feeText = fmtMoney(student.monthly_fee) + ((Number(student.maintenance_fee) || 0) > 0 ? " (seat rent " + fmtMoney(student.seat_rent) + " + maintenance " + fmtMoney(student.maintenance_fee) + ")" : "");
          if (due <= 0) {
            infoEl.innerHTML = '<span style="font-weight:600;color:var(--accent)">Fully paid for ' + esc(monthLabel(period)) + '</span><span class="dim"> — fee ' + feeText + ", all received.</span>";
            if (amtEl) amtEl.value = "";
          } else {
            infoEl.innerHTML = '<span class="dim">Monthly fee ' + feeText + " · already paid " + fmtMoney(paidAmt) + ' · </span><span class="due-glow" style="font-weight:600">Due ' + fmtMoney(due) + "</span>";
            if (amtEl) amtEl.value = String(due);
          }
        }
        entry.el.querySelector("#p-period").addEventListener("change", refreshDue);
        entry.el.querySelector("#p-period").addEventListener("input", refreshDue);
        refreshDue();
        Array.prototype.forEach.call(entry.el.querySelectorAll("[data-ptype]"), function (b) {
          b.addEventListener("click", function () {
            type = b.getAttribute("data-ptype");
            Array.prototype.forEach.call(entry.el.querySelectorAll("[data-ptype]"), function (x) {
              x.setAttribute("aria-pressed", x === b ? "true" : "false");
            });
            entry.el.querySelector("[data-period-wrap]").style.display = type === "monthly" ? "" : "none";
            if (type === "monthly") refreshDue();
            else entry.el.querySelector("#p-amount").value = s.default_admission_fee || "";
          });
        });
      }

      /* ---------------- monthly payment form ---------------- */
      function openMonthlyPayment(initialStudentId) {
        var s = state.settings;
        var month = currentMonth();
        var unpaid = unpaidIdSet(month);
        var mp = {
          studentId: initialStudentId || null,
          search: "",
          startMonth: month,
          count: 1,
          amount: "",
          date: todayStr(),
          note: ""
        };
        if (mp.studentId) {
          var st0 = studentById(mp.studentId);
          if (st0) {
            // A normal monthly payment: the form opens on the current month,
            // pre-filled with what is still due for it — the same as picking
            // the student from the list. No month has to be paid before
            // another; outstanding dues are collected from the Reminders tab,
            // where any month can be chosen in this same form.
            var d0 = monthDue(st0, mp.startMonth);
            mp.amount = d0 > 0 ? String(d0) : "";
          }
        }

        var entry = openOverlay("", { title: "Monthly payment" });
        var form = document.createElement("form");
        form.className = "form-stack";
        entry.el.querySelector(".overlay-inner").appendChild(form);

        function monthInfo(period) {
          var st = studentById(mp.studentId);
          var fee = st ? (Number(st.monthly_fee) || 0) : 0;
          var paidAmt = monthPaidTotal(mp.studentId, period);
          return { fee: fee, seat: st ? (Number(st.seat_rent) || 0) : 0, maint: st ? (Number(st.maintenance_fee) || 0) : 0, paid: paidAmt, due: Math.max(0, fee - paidAmt) };
        }
        function payablePeriods() {
          return periods().filter(function (p) { return monthInfo(p).due > 0; });
        }
        function periods() {
          var out = [];
          for (var i = 0; i < mp.count; i++) out.push(addMonths(mp.startMonth, i));
          return out;
        }

        function render() {
          // Preserve typed values before re-rendering the picked-student section.
          var dateEl = form.querySelector("#mp-date"); if (dateEl) mp.date = dateEl.value;
          var noteEl = form.querySelector("#mp-note"); if (noteEl) mp.note = noteEl.value;
          var amtEl = form.querySelector("#mp-amount"); if (amtEl) mp.amount = amtEl.value;

          if (!mp.studentId) {
            var matches = sortedStudents().filter(function (st) { return studentMatchesSearch(st, mp.search); });
            form.innerHTML =
              fieldHtml("Who is paying?", '<input class="input" id="mp-search" aria-label="Search students by name, room or mobile" placeholder="Search by name, room or mobile…" autocomplete="off" inputmode="' + (/^\d+$/.test(mp.search.trim()) ? "numeric" : "text") + '" value="' + esc(mp.search) + '" />') +
              (matches.length === 0
                ? '<p class="dim" style="padding:2rem 0;text-align:center">No students match your search.</p>'
                : '<ul class="picker-list">' + matches.map(function (st) {
                    return '<li><button type="button" class="row-btn" data-pick="' + st.id + '"><span style="min-width:0"><span class="name-line">' +
                      (unpaid[st.id] ? unpaidDot(month) : "") + '<span class="nm">' + esc(st.name) + "</span></span>" +
                      '<span class="small dim" style="display:block">' + (st.room_no ? "Room " + esc(st.room_no) + " · " : "") + esc(st.phone) + "</span></span>" +
                      (st.status === "inactive" ? '<span class="badge badge-warn">Left</span>' : '<span class="dim">' + I.chevR + "</span>") +
                      "</button></li>";
                  }).join("") + "</ul>") +
              '<p class="err-text" data-form-error style="display:none"></p>' +
              '<div class="btn-row" style="padding-top:0.25rem"><button type="button" class="btn" data-cancel>Cancel</button>' +
              '<button type="submit" class="btn btn-primary" disabled>Save &amp; make receipt</button></div>';

            var searchEl = form.querySelector("#mp-search");
            searchEl.addEventListener("input", function () {
              mp.search = searchEl.value;
              var pos = searchEl.selectionStart;
              render();
              var el2 = form.querySelector("#mp-search");
              el2.focus();
              try { el2.setSelectionRange(pos, pos); } catch (e) {}
            });
            Array.prototype.forEach.call(form.querySelectorAll("[data-pick]"), function (b) {
              b.addEventListener("click", function () {
                mp.studentId = Number(b.getAttribute("data-pick"));
                var st = studentById(mp.studentId);
                var dPick = st ? monthInfo(mp.startMonth).due : 0;
                mp.amount = dPick > 0 ? String(dPick) : "";
                render();
              });
            });
          } else {
            var student = studentById(mp.studentId);
            var ps = periods();
            var infos = ps.map(function (p) { return { period: p, info: monthInfo(p) }; });
            var fullMonths = infos.filter(function (x) { return x.info.due <= 0; });
            var payableCount = ps.length - fullMonths.length;
            var allFull = payableCount === 0;
            var total = (Number(mp.amount) || 0) * payableCount;
            form.innerHTML =
              '<div class="card" style="padding:1rem;display:flex;align-items:flex-start;justify-content:space-between;gap:0.75rem"><div>' +
                '<p class="font-display" style="font-size:1.125rem;font-weight:600">' + esc(student.name) + "</p>" +
                '<p class="small dim">' + (student.room_no ? "Room " + esc(student.room_no) : "No room set") + (student.department ? " · " + esc(student.department) : "") + " · " + esc(student.phone) + "</p>" +
                '<p class="small dim">Monthly fee: <span class="tnum" style="font-weight:500;color:var(--text)">' + fmtMoney(student.monthly_fee) + "</span>" + ((Number(student.maintenance_fee) || 0) > 0 ? ' <span class="tnum">(seat rent ' + fmtMoney(student.seat_rent) + " + maintenance " + fmtMoney(student.maintenance_fee) + ")</span>" : "") + "</p></div>" +
                '<button type="button" class="btn" data-change style="min-height:2.25rem;padding:0.375rem 0.75rem;font-size:0.875rem;border-radius:999px">Change</button></div>' +
              '<div class="grid-2">' +
                fieldHtml("Month", inputHtml("mp-start", "Month of payment", mp.startMonth, 'type="month"')) +
                fieldHtml("How many months",
                  '<div class="stepper"><button type="button" id="mp-minus" aria-label="One month less"' + (mp.count <= 1 ? " disabled" : "") + ">−</button>" +
                  '<input class="input tnum count font-display" id="mp-count" aria-label="How many months" inputmode="numeric" autocomplete="off" value="' + mp.count + '" style="width:3.5rem;padding:0.375rem 0.25rem" />' +
                  '<button type="button" id="mp-plus" aria-label="One month more"' + (mp.count >= 12 ? " disabled" : "") + ">+</button></div>") +
              "</div>" +
              '<ul style="display:flex;flex-direction:column;gap:0.25rem">' + infos.map(function (x) {
                return '<li class="small"><span style="font-weight:500">' + esc(monthLabel(x.period)) + '</span><span class="dim"> — ' + (x.info.maint > 0 ? "seat rent " + fmtMoney(x.info.seat) + " + maintenance " + fmtMoney(x.info.maint) + " = fee " + fmtMoney(x.info.fee) : "fee " + fmtMoney(x.info.fee)) + " · paid " + fmtMoney(x.info.paid) + " · </span>" +
                  (x.info.due > 0 ? '<span class="due-glow" style="font-weight:600">Due ' + fmtMoney(x.info.due) + "</span>" : '<span style="font-weight:600;color:var(--accent)">Fully paid</span>') + "</li>";
              }).join("") + "</ul>" +
              (allFull
                ? '<p class="warn-box">Fully paid for ' + ps.map(monthLabel).join(", ") + " — nothing is due for the selected months.</p>"
                : (fullMonths.length ? '<p class="small dim">' + fullMonths.map(function (x) { return monthLabel(x.period); }).join(", ") + (fullMonths.length === 1 ? " is" : " are") + " already fully paid and will be skipped.</p>" : "")) +
              '<div class="grid-2">' +
                fieldHtml(mp.count > 1 ? "Amount per month (৳)" : "Amount received (৳)", inputHtml("mp-amount", "Amount per month in taka", mp.amount, 'inputmode="numeric" autocomplete="off"'), "Pre-filled with the remaining due — change it if a different amount was paid.") +
                fieldHtml("Date received", inputHtml("mp-date", "Date received", mp.date, 'type="date"')) +
              "</div>" +
              (payableCount > 1 ? '<p class="small">Total for ' + payableCount + ' months: <strong class="tnum">' + fmtMoney(total) + '</strong><span class="dim"> — one combined receipt will be made for all ' + payableCount + ' months.</span></p>' : "") +
              fieldHtml("Note (optional)", inputHtml("mp-note", "Note", mp.note, 'placeholder="e.g. Paid in two parts" autocomplete="off"')) +
              '<p class="err-text" data-form-error style="display:none"></p>' +
              '<div class="btn-row" style="padding-top:0.25rem"><button type="button" class="btn" data-cancel>Cancel</button>' +
              '<button type="submit" class="btn btn-primary"' + (allFull ? " disabled" : "") + ">" + (payableCount > 1 ? "Save " + payableCount + " months · " + fmtMoney(total) : "Save &amp; make receipt") + "</button></div>";

            form.querySelector("[data-change]").addEventListener("click", function () { mp.studentId = null; render(); });
            form.querySelector("#mp-start").addEventListener("change", function (e) {
              mp.startMonth = e.target.value;
              // Re-prefill with the newly picked month's remaining due. render()
              // preserves the amount field's value, so update the field too.
              var dStart = monthInfo(mp.startMonth).due;
              if (dStart > 0) {
                mp.amount = String(dStart);
                var amtInput = form.querySelector("#mp-amount");
                if (amtInput) amtInput.value = String(dStart);
              }
              render();
            });
            form.querySelector("#mp-minus").addEventListener("click", function () { mp.count = Math.max(1, mp.count - 1); render(); });
            form.querySelector("#mp-plus").addEventListener("click", function () { mp.count = Math.min(12, mp.count + 1); render(); });
            // The month count can also be typed directly (number keyboard).
            // Typing only updates the state — no re-render, so the keyboard
            // stays up; leaving the field applies it and refreshes the list.
            var countEl = form.querySelector("#mp-count");
            countEl.addEventListener("input", function (e) {
              var n = parseInt(e.target.value, 10);
              if (!isNaN(n)) mp.count = Math.min(12, Math.max(1, n));
            });
            countEl.addEventListener("change", function (e) {
              var n = parseInt(e.target.value, 10);
              mp.count = isNaN(n) ? 1 : Math.min(12, Math.max(1, n));
              render();
            });
            form.querySelector("#mp-amount").addEventListener("input", function (e) {
              mp.amount = e.target.value;
              var btn = form.querySelector('button[type="submit"]');
              var pc = payablePeriods().length;
              var t = (Number(mp.amount) || 0) * pc;
              btn.textContent = pc > 1 ? "Save " + pc + " months · " + fmtMoney(t) : "Save & make receipt";
            });
          }
          form.querySelector("[data-cancel]").addEventListener("click", closeOverlay);
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          if (!mp.studentId) { formError(form, "Pick the student who is paying."); return; }
          var startEl = form.querySelector("#mp-start"); if (startEl) mp.startMonth = startEl.value;
          var cntEl = form.querySelector("#mp-count"); if (cntEl) { var cn = parseInt(cntEl.value, 10); if (!isNaN(cn)) mp.count = Math.min(12, Math.max(1, cn)); }
          var amtEl = form.querySelector("#mp-amount"); if (amtEl) mp.amount = amtEl.value;
          var dateEl = form.querySelector("#mp-date"); if (dateEl) mp.date = dateEl.value;
          var noteEl = form.querySelector("#mp-note"); if (noteEl) mp.note = noteEl.value;
          if (!/^\d{4}-\d{2}$/.test(mp.startMonth)) { formError(form, "Pick the month of the payment."); return; }
          if (!Number(mp.amount) || Number(mp.amount) <= 0) { formError(form, "Enter the amount received per month."); return; }
          var ps = periods();
          var payable = payablePeriods();
          if (!payable.length) { formError(form, "Fully paid for " + ps.map(monthLabel).join(", ") + " — nothing is due."); return; }
          if (!mp.date) { formError(form, "Payment date is required."); return; }
          formError(form, "");
          var perMonthAmt = Number(mp.amount);
          var pay;
          if (payable.length > 1) {
            // Several months paid in one go: a single payment record — and a
            // single combined receipt — covering all of them, instead of one
            // receipt per month. period stays the first covered month.
            pay = { id: state.nextPaymentId++, student_id: mp.studentId, type: "monthly", period: payable[0], periods: payable.slice(), amount_per_month: perMonthAmt, amount: perMonthAmt * payable.length, date: mp.date, note: mp.note.trim() || null };
          } else {
            pay = { id: state.nextPaymentId++, student_id: mp.studentId, type: "monthly", period: payable[0], amount: perMonthAmt, date: mp.date, note: mp.note.trim() || null };
          }
          state.payments.push(pay);
          saveState();
          closeOverlay();
          openReceipt(pay.id, null);
        });

        render();
      }

      /* ---------------- receipt ---------------- */
      function openReceipt(paymentId, batchIds) {
        var entry = openOverlay("", { title: "Receipt", receipt: true });
        var container = entry.el.querySelector(".overlay-inner");
        var viewId = paymentId;

        function render() {
          var payment = paymentById(viewId);
          if (!payment) { container.querySelector("[data-receipt-body]").innerHTML = '<p class="dim" style="padding:2.5rem 0;text-align:center">This receipt could not be loaded.</p>'; return; }
          var student = studentById(payment.student_id);
          var s = state.settings;
          var body = student ? smsBody(student, payment) : "";
          var smsHref = student ? "sms:" + intlPhone(student.phone) + "?&body=" + encodeURIComponent(body) : "#";
          var waHref = student ? "https://wa.me/" + intlPhone(student.phone) + "?text=" + encodeURIComponent(body) : "#";

          var lineItems = paymentLines(payment, student);
          var feeLines = lineItems.map(function (l) {
            return '<div class="r-line"><span>' + esc(l.label) + '</span><span class="tnum" style="font-weight:500">' + fmtMoney(l.amount) + "</span></div>";
          }).join("");

          // Multi-month combined receipts keep their month-range heading
          // above the per-month fee lines.
          var rangeLine = "";
          if (payment.type !== "admission" && Array.isArray(payment.periods) && payment.periods.length > 1) {
            rangeLine = '<p class="r-range">' + esc(paymentDesc(payment)) + "</p>";
          }

          var dueLine = "";
          if (student) {
            var td = totalDue(student);
            if (td > 0) {
              dueLine = '<p class="r-due">Due (P+C): Previous ' + fmtMoney(previousDue(student)) + " + Current " + fmtMoney(currentDueAmt(student)) + " = " + fmtMoney(td) + "</p>";
            }
          }

          var idParts = [];
          if (student) {
            if (student.roll_no) idParts.push("ID: " + esc(student.roll_no));
            if (student.room_no || student.bed_no) idParts.push("Room: " + esc(student.room_no || "") + (student.bed_no ? " / " + esc(student.bed_no) : ""));
            if (student.phone) idParts.push("Mobile: " + esc(student.phone));
          }

          // One copy of the receipt; the sheet prints two of them side by
          // side — Office Copy for the hall, Student Copy for the student.
          function copyHtml(label) {
            return '<div class="r-copy">' +
              '<p class="r-copy-label">' + label + "</p>" +
              '<div class="r-head">' +
                '<img src="' + LOGO + '" alt="Pabna Textile Engineering College logo" />' +
                '<p class="r-hostel font-display">' + esc(s.hostel_name) + "</p>" +
                '<p class="r-college">' + esc(s.college_name) + "</p>" +
                (s.address_line ? '<p class="r-sub">' + esc(s.address_line) + "</p>" : "") +
                (s.contact_phone ? '<p class="r-sub">Phone: ' + esc(s.contact_phone) + "</p>" : "") +
              "</div>" +
              '<p class="r-title font-display"><span>Money Receipt</span></p>' +
              '<div class="r-meta"><span>Receipt No: <strong class="tnum">' + receiptNo(payment.id) + "</strong></span><span>Date: <strong>" + esc(fmtDate(payment.date)) + "</strong></span></div>" +
              '<p class="r-from"><span class="r-lab">Received from:</span> <strong>' + esc(student ? student.name : "—") + "</strong></p>" +
              (idParts.length ? '<p class="r-idline">' + idParts.join(" · ") + "</p>" : "") +
              '<div class="r-amounts">' +
                rangeLine + feeLines +
                (payment.note ? '<p class="r-words" style="font-style:normal">Note: ' + esc(payment.note) + "</p>" : "") +
                '<div class="r-total font-display"><span>Total Received</span><span class="tnum">' + fmtMoney(payment.amount) + "</span></div>" +
                '<p class="r-words">In words: Taka ' + esc(inWords(payment.amount)) + " only.</p>" +
                dueLine +
              "</div>" +
              '<div class="r-foot"><p class="r-thanks">Thank you</p>' +
                '<div class="r-sign"><div class="line"></div><p>In-charge, ' + esc(s.hostel_name) + "</p></div>" +
              "</div>" +
            "</div>";
          }

          var scissors = '<svg class="r-scissors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88"/><path d="M14.47 14.48 20 20"/><path d="M8.12 8.12 12 12"/></svg>';

          // Receipts with many fee lines (multi-month payments) get the
          // r-long class so print can squeeze them into the half-A4 slip.
          var sheet =
            '<div class="receipt-sheet' + (lineItems.length > 10 ? " r-long" : "") + '">' +
              copyHtml("Office Copy") +
              '<div class="r-cut">' + scissors + "</div>" +
              copyHtml("Student Copy") +
            "</div>";

          var batch = "";
          if (batchIds && batchIds.length > 1) {
            batch = '<div class="batch-picker no-print"><p class="small" style="font-weight:500">Receipts made in this payment</p><div class="batch-chips">' +
              batchIds.map(function (id) {
                return '<button type="button" data-batch="' + id + '" aria-pressed="' + (id === viewId) + '" aria-label="View receipt ' + receiptNo(id) + '">' + receiptNo(id) + "</button>";
              }).join("") + "</div></div>";
          }

          var actions =
            '<div class="receipt-actions no-print">' +
              '<button type="button" class="btn btn-primary" data-print>' + I.printer + " Print receipt</button>" +
              '<div class="two">' +
                '<a class="btn" href="' + smsHref + '">' + I.message + " Send SMS</a>" +
                '<a class="btn" href="' + waHref + '" target="_blank" rel="noreferrer">' + I.whatsapp + " WhatsApp</a>" +
              "</div>" +
              '<p class="xsmall dim" style="text-align:center">SMS opens your phone\'s Messages app with the text ready — just press send. It goes from your own SIM, so it is free of any gateway charge.</p>' +

      /* ---------------- student detail ---------------- */
      function openStudentDetail(studentId) {
        var entry = openOverlay("", {
          title: "Student details",
          refresh: function () { renderDetail(); }
        });
        var container = entry.el.querySelector(".overlay-inner");
        var bodyDiv = document.createElement("div");
        container.appendChild(bodyDiv);

        function renderDetail() {
          var student = studentById(studentId);
          if (!student) { closeOverlay(); return; }
          var month = currentMonth();
          var isUnpaid = student.status === "active" && !!unpaidIdSet(month)[student.id];
          var history = paymentsDesc().filter(function (p) { return p.student_id === student.id; }).slice(0, 200);
          var rows = [
            ["Father's name", student.father_name],
            ["Mobile", student.phone],
            ["Guardian mobile", student.guardian_phone || ""],
            ["Room / Bed", [student.room_no, student.bed_no].filter(Boolean).join(" / ")],
            ["ID", student.roll_no || ""],
            ["Department", student.department],
            ["Session", student.session],
            ["Admission date", fmtDate(student.admission_date)],
            ["Seat rent", student.seat_rent != null ? fmtMoney(student.seat_rent) : ""],
            ["Maintenance fee", student.seat_rent != null ? fmtMoney(student.maintenance_fee) : ""],
            ["Monthly fee", fmtMoney(student.monthly_fee)],
            ["Address", student.address || ""]
          ].filter(function (r) { return r[1] !== ""; });
          var prevD = previousDue(student), curD = currentDueAmt(student);
          if (prevD + curD > 0) {
            if (prevD > 0) rows.push(["Previous due (P)", fmtMoney(prevD)]);
            rows.push(["Current due (C)", fmtMoney(curD)]);
            rows.push(["Total due (P+C)", fmtMoney(prevD + curD)]);
          }

          bodyDiv.innerHTML =
            '<div class="card" style="padding:1rem"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.75rem"><div>' +
              '<p class="font-display name-line" style="font-size:1.25rem;font-weight:600">' + (isUnpaid ? unpaidDot(month) : "") + esc(student.name) + "</p>" +
              '<p class="small dim">' + (student.room_no ? "Room " + esc(student.room_no) : "No room set") + (student.department ? " · " + esc(student.department) : "") + "</p>" +
              (isUnpaid ? '<p class="small due-glow" style="margin-top:2px;font-weight:500">Due (P+C) ' + fmtMoney(totalDue(student)) + (previousDue(student) > 0 ? ' <span style="font-weight:400">(Previous ' + fmtMoney(previousDue(student)) + ' + Current ' + fmtMoney(monthDue(student, month)) + ')</span>' : ' for ' + esc(monthLabel(month)) + (monthPaidTotal(student.id, month) > 0 ? ' <span style="font-weight:400">(paid ' + fmtMoney(monthPaidTotal(student.id, month)) + ' of ' + fmtMoney(student.monthly_fee) + ')</span>' : "")) + "</p>" : "") +
              '</div><span class="badge ' + (student.status === "active" ? "badge-accent" : "badge-warn") + '">' + (student.status === "active" ? "Active" : "Left hostel") + "</span></div>" +
              '<dl class="detail-rows">' + rows.map(function (r) { return '<div class="kv"><dt>' + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd></div>"; }).join("") + "</dl></div>" +
            '<button type="button" class="btn btn-primary" data-pay style="width:100%;margin-top:1rem;padding:0.875rem 1rem">' + I.wallet + " Record payment</button>" +
            '<div class="btn-row" style="margin-top:0.75rem">' +
              '<button type="button" class="btn" data-edit>Edit details</button>' +
              '<button type="button" class="btn" data-status>' + (student.status === "active" ? "Mark as left" : "Reactivate") + "</button>" +
            "</div>" +
            '<h3 class="font-display" style="font-size:1rem;font-weight:600;margin:2rem 0 0.5rem">Payment history</h3>' +
            (history.length === 0
              ? '<p class="card dim" style="padding:1.5rem 1rem;text-align:center">No payments recorded yet.</p>'
              : '<ul class="list-card">' + history.map(function (p) {
                  return '<li><button type="button" class="row-btn" data-receipt="' + p.id + '"><span><span style="display:block;font-weight:500">' + esc(paymentDesc(p)) + '</span>' +
                    '<span class="small dim" style="display:block">' + receiptNo(p.id) + " · " + esc(fmtDate(p.date)) + '</span></span>' +
                    '<span class="tnum font-display" style="font-weight:600">' + fmtMoney(p.amount) + "</span></button></li>";
                }).join("") + "</ul>") +
            '<div style="margin-top:2.5rem;border-top:1px solid var(--border);padding-top:1rem" data-delete-zone>' +
              '<button type="button" data-del-ask style="width:100%;padding:0.5rem 0;font-size:0.875rem;font-weight:500;color:var(--danger);min-height:2.25rem">Delete this student and all records</button>' +
              '<p class="xsmall dim" style="text-align:center;margin-top:0.25rem">Deleting removes the student and every payment record permanently.</p></div>';

          bodyDiv.querySelector("[data-pay]").addEventListener("click", function () { openPaymentForm(student.id); });
          bodyDiv.querySelector("[data-edit]").addEventListener("click", function () { openStudentForm(student); });
          bodyDiv.querySelector("[data-status]").addEventListener("click", function () {
            student.status = student.status === "active" ? "inactive" : "active";
            saveState();
            renderDetail();
            renderMain();

          Array.prototype.forEach.call(bodyDiv.querySelectorAll("[data-receipt]"), function (b) {
            b.addEventListener("click", function () { openReceipt(Number(b.getAttribute("data-receipt")), null); });
          });
          bodyDiv.querySelector("[data-del-ask]").addEventListener("click", function () {
            var zone = bodyDiv.querySelector("[data-delete-zone]");
            zone.innerHTML = '<p style="font-weight:600">Delete ' + esc(student.name) + '?</p>' +
              '<p class="small dim" style="margin:0.25rem 0 0.75rem">This removes the student and every payment record permanently.</p>' +
              '<div class="btn-row"><button type="button" class="btn" data-del-keep>Keep student</button><button type="button" class="btn btn-danger" data-del-yes>Delete student</button></div>';
            zone.querySelector("[data-del-keep]").addEventListener("click", renderDetail);
            zone.querySelector("[data-del-yes]").addEventListener("click", function () {
              state.payments = state.payments.filter(function (p) { return p.student_id !== student.id; });
              state.students = state.students.filter(function (st) { return st.id !== student.id; });
              saveState();
              closeOverlay();
            });
          });
        }

        renderDetail();
      }

      /* ---------------- settings + backup ---------------- */

            fieldHtml("Default seat rent (৳)", inputHtml("s-dseat", "Default seat rent in taka", s.default_seat_rent || "", 'inputmode="numeric" autocomplete="off"')) +
            fieldHtml("Default maintenance fee (৳)", inputHtml("s-dmaint", "Default maintenance fee in taka", s.default_maintenance_fee || "", 'inputmode="numeric" autocomplete="off"')) +

          '<div class="backup-box">' +
            '<h3 class="font-display">Account</h3>' +
            '<p class="small dim">Signed in as <strong>' + esc(session ? session.email : "") + '</strong>. Records are stored online and sync automatically. <span id="account-sync">' + esc(syncText) + '</span></p>' +
            '<button type="button" class="btn" id="btn-logout" style="width:100%;margin-top:0.75rem">Log out</button>' +

          '<div class="backup-box">' +
            '<h3 class="font-display">Backup &amp; restore</h3>' +

            '<div class="btn-row" style="margin-top:0.75rem">' +
              '<button type="button" class="btn" id="btn-export">Export data</button>' +
              '<button type="button" class="btn" id="btn-import">Import data</button>' +
            "</div>" +

            '<div id="import-zone" style="margin-top:0.75rem"></div>' +
          "</div></div>";
        view.innerHTML = html;

        var installBtn = document.getElementById("btn-install");
        if (installBtn) installBtn.addEventListener("click", installApp);
        refreshInstallBox();

        document.getElementById("settings-form").addEventListener("submit", function (e) {
          e.preventDefault();
          function val(id) { return document.getElementById(id).value; }
          state.settings = {
            hostel_name: val("s-hostel").trim(),
            college_name: val("s-college").trim(),
            address_line: val("s-address").trim(),
            contact_phone: val("s-phone").trim(),
            incharge_name: val("s-incharge").trim(),
            default_admission_fee: Number(val("s-dafee")) || 0,
            default_seat_rent: Number(val("s-dseat")) || 0,
            default_maintenance_fee: Number(val("s-dmaint")) || 0,
            default_monthly_fee: (Number(val("s-dseat")) || 0) + (Number(val("s-dmaint")) || 0)
          };
          saveState();
          var saved = document.getElementById("settings-saved");
          saved.style.display = "";
          renderTabbar();
          showToast("Settings saved");
        });

        document.getElementById("btn-logout").addEventListener("click", doLogout);

        document.getElementById("btn-export").addEventListener("click", function () {
          var payload = {
            app: "hostel-manager",
            version: 1,
            exported_at: new Date().toISOString(),
            settings: state.settings,
            students: state.students,
            payments: state.payments,
            nextStudentId: state.nextStudentId,
            nextPaymentId: state.nextPaymentId
          };
          var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "hostel-backup-" + todayStr() + ".json";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        });

        var fileInput = document.getElementById("import-file");
        document.getElementById("btn-import").addEventListener("click", function () { fileInput.click(); });
        fileInput.addEventListener("change", function () {
          var file = fileInput.files && fileInput.files[0];
          fileInput.value = "";
          if (!file) return;
          var zone = document.getElementById("import-zone");
          var reader = new FileReader();
          reader.onload = function () {
            var parsed;
            try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
            if (!parsed || !Array.isArray(parsed.students) || !Array.isArray(parsed.payments)) {
              zone.innerHTML = '<p class="err-text">That file is not a Hostel Manager backup. Nothing was changed.</p>';
              return;
            }
            var countS = parsed.students.length, countP = parsed.payments.length;
            zone.innerHTML = '<div class="warn-box">This backup has <strong>' + countS + " students</strong> and <strong>" + countP + " payments</strong>. Importing will replace everything currently on this phone." +
              '<div class="btn-row" style="margin-top:0.75rem"><button type="button" class="btn" id="import-cancel">Cancel</button>' +
              '<button type="button" class="btn btn-danger" id="import-confirm">Replace all data</button></div></div>';
            document.getElementById("import-cancel").addEventListener("click", function () { zone.innerHTML = ""; });
            document.getElementById("import-confirm").addEventListener("click", function () {
              var next = defaultState();
              if (parsed.settings) next.settings = Object.assign({}, SETTING_DEFAULTS, parsed.settings);
              next.students = parsed.students;
              next.payments = parsed.payments;
              if (typeof parsed.nextStudentId === "number") next.nextStudentId = parsed.nextStudentId;
              if (typeof parsed.nextPaymentId === "number") next.nextPaymentId = parsed.nextPaymentId;
              next.students.forEach(function (st) { if (st.id >= next.nextStudentId) next.nextStudentId = st.id + 1; });
              next.payments.forEach(function (p) { if (p.id >= next.nextPaymentId) next.nextPaymentId = p.id + 1; });
              state = migrateState(next);
              saveState();
              closeAllOverlays();
              currentTab = "home";
              renderMain();
              window.scrollTo(0, 0);
              showToast("Backup imported — records replaced");
            });
          };
          reader.onerror = function () {
            zone.innerHTML = '<p class="err-text">The file could not be read. Nothing was changed.</p>';
          };
          reader.readAsText(file);
        });
      }

      /* ---------------- login / logout / boot ---------------- */
      var tabbarEl = document.querySelector(".tabbar");

      function showLogin(errorMsg) {
        while (overlayStack.length) { var oe = overlayStack.pop(); oe.el.remove(); }
        if (tabbarEl) tabbarEl.style.display = "none";
        var pill = document.getElementById("sync-pill");
        if (pill) pill.style.display = "none";
        var s = state.settings;
        view.innerHTML =
          '<div class="login-wrap view-enter"><div class="login-card">' +
            '<img src="' + LOGO + '" alt="Pabna Textile Engineering College logo" />' +
            '<p class="font-display" style="text-align:center;font-size:1.25rem;font-weight:700;line-height:1.25">' + esc(s.hostel_name) + "</p>" +
            '<p class="small dim" style="text-align:center">' + esc(s.college_name) + "</p>" +
            '<form id="login-form" class="form-stack" style="margin-top:1.25rem;padding-bottom:0">' +
              fieldHtml("Email", inputHtml("login-email", "Email", "", 'type="email" autocomplete="username" placeholder="you@example.com"')) +
              fieldHtml("Password", inputHtml("login-password", "Password", "", 'type="password" autocomplete="current-password" placeholder="Your password"')) +
              '<p class="err-text" id="login-error" style="display:' + (errorMsg ? "" : "none") + '">' + esc(errorMsg || "") + "</p>" +
              '<button type="submit" class="btn btn-primary" id="login-btn" style="width:100%">Sign in</button>' +
            "</form>" +
            '<p class="xsmall dim" style="text-align:center;margin-top:1rem">Sign in to see the hostel records. Records are stored online, so they are the same on every phone.</p>' +
          "</div></div>";
        var form = document.getElementById("login-form");
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var email = document.getElementById("login-email").value.trim();
          var password = document.getElementById("login-password").value;
          var errEl = document.getElementById("login-error");
          var btn = document.getElementById("login-btn");
          if (!email || !password) { errEl.textContent = "Enter your email and password."; errEl.style.display = ""; return; }
          errEl.style.display = "none";
          btn.disabled = true;
          btn.textContent = "Signing in…";
          tokenRequest("password", { email: email, password: password }).then(function (res) {
            if (res.ok && res.data.access_token) {
              saveSession(sessionFromTokenResponse(res.data));
              afterLogin();
            } else {
              btn.disabled = false;
              btn.textContent = "Sign in";
              var msg = (res.data && (res.data.error_description || res.data.msg)) || "";
              errEl.textContent = /invalid/i.test(msg) ? "Wrong email or password. Please try again." : (msg || "Could not sign in. Check your internet connection and try again.");
              errEl.style.display = "";
            }
          }).catch(function () {
            btn.disabled = false;
            btn.textContent = "Sign in";
            errEl.textContent = "Could not sign in. Check your internet connection and try again.";
            errEl.style.display = "";
          });
        });
        var emailEl = document.getElementById("login-email");
        if (emailEl) emailEl.focus();
      }

      function finishLogin() {
        if (tabbarEl) tabbarEl.style.display = "";
        currentTab = "home";
        renderMain();
        window.scrollTo(0, 0);
      }

      function afterLogin() {
        if (tabbarEl) tabbarEl.style.display = "none";
        view.innerHTML = '<div style="padding-top:1rem" role="status" aria-label="Loading your hostel data">' +
          '<div style="display:flex;align-items:center;gap:0.75rem"><div class="skel" style="width:3.5rem;height:3.5rem;border-radius:999px;flex-shrink:0"></div>' +
          '<div style="flex:1;min-width:0"><div class="skel" style="height:1.125rem;width:55%"></div><div class="skel" style="height:0.875rem;width:75%;margin-top:0.5rem"></div></div></div>' +
          '<div class="skel" style="height:3rem;width:45%;margin-top:1.75rem"></div>' +
          '<div class="skel" style="height:1rem;width:70%;margin-top:0.75rem"></div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-top:1.5rem"><div class="skel" style="height:3.5rem"></div><div class="skel" style="height:3.5rem"></div></div>' +
          '<div class="skel" style="height:8rem;margin-top:1.5rem"></div>' +
          '<p class="dim" style="margin-top:1.25rem;text-align:center">Loading your hostel data…</p></div>';
        setSyncUI("syncing");
        fetchRemoteState().then(function (remote) {
          var remoteEmpty = !remote || (typeof remote === "object" && Object.keys(remote).length === 0);
          if (remoteEmpty) {
            // First run online: upload whatever this device already has, so
            // nothing recorded before the online version is lost.
            state = loadState();
            cacheState();
            return pushRemoteState().then(function () { finishLogin(); });
          }
          state = migrateState(normalizeState(remote));
          cacheState();
          setSyncUI("saved");
          finishLogin();
        }).catch(function (err) {
          if (err && err.message === "session") {
            saveSession(null);
            showLogin("Your session has ended. Please sign in again.");
            return;
          }
          // Offline at launch: keep working from this device's cached copy;
          // changes will sync when the connection is back.
          state = loadState();
          syncPending = true;
          setSyncUI("offline");
          finishLogin();
        });
      }

      function doLogout() {
        var token = session && session.access_token;
        saveSession(null);
        if (syncTimer) { clearTimeout(syncTimer); syncTimer = null; }
        syncPending = false;
        syncInFlight = false;
        if (token) {
          try {
            fetch(SB_URL + "/auth/v1/logout", {
              method: "POST",
              headers: { "apikey": SB_KEY, "Authorization": "Bearer " + token }
            }).catch(function () {});
          } catch (e) { /* ignore */ }
        }
        showLogin("");
      }

         and app icons, so Chrome can install it as a real app: its own
         icon, full-screen, no browser bar. The Install button below uses
         the browser's own install prompt when Chrome offers one; on
         iPhone (or before Chrome offers it) it shows the manual steps.

      if ("serviceWorker" in navigator) {
